# =============================================================================
# Flight Routes Configuration
# =============================================================================
# Define the flight routes to monitor for price alerts.
# All prices are ONE-WAY (solo ida).
#
# Fields:
#   - origin: Airport IATA code (e.g., BAQ for Barranquilla)
#   - destination: Airport IATA code (e.g., MDE for Medellín)
#   - price_threshold: Maximum price in COP to trigger notification (per leg)
#   - drop_percentage: Minimum price drop % to trigger notification
#   - search_days: Days to search (thursday, friday, saturday, sunday, monday)

# =============================================================================
# Airline Policy
# =============================================================================
# Controls which airlines are included and at what price thresholds.
#
# Decision order (first match wins):
#   1. Priority airlines  → include if price ≤ route price_threshold
#   2. Bargain threshold  → include ANY airline if price ≤ bargain_threshold
#   3. Extra airlines     → per-airline rules with custom max_price
#
# Add airlines to extra_airlines at any time — no restart needed.
# Set max_price: null to always include regardless of price.

airline_policy:
  priority_airlines:
    - LATAM             # Priority: beneficios/puntos. Include if ≤ route threshold.
  bargain_threshold: 110000   # Any airline at this price or below is always included.
  extra_airlines:
    - name: Wingo
      max_price: 150000
    - name: JetSMART
      max_price: 150000
    - name: Avianca
      max_price: 150000

routes:
  # === OUTBOUND (IDA) - Thursday/Friday ===
  - origin: BAQ
    destination: MDE
    price_threshold: 300000
    drop_percentage: 15
    search_days: [thursday, friday]

  # CTG-MDE disabled: travel time from Barranquilla not worth it unless very cheap
  # - origin: CTG
  #   destination: MDE
  #   price_threshold: 100000  # Only if <= 100k COP
  #   drop_percentage: 15
  #   search_days: [thursday, friday]

  # === RETURN (VUELTA) - Sunday/Monday ===
  - origin: MDE
    destination: BAQ
    price_threshold: 300000
    drop_percentage: 15
    search_days: [sunday, monday]

  # MDE-CTG disabled: return route for CTG (disabled above)
  # - origin: MDE
  #   destination: CTG
  #   price_threshold: 100000
  #   drop_percentage: 15
  #   search_days: [sunday, monday]

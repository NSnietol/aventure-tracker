# yaml-language-server: $schema=
# =============================================================================
# Flight Routes Configuration
# =============================================================================
# search_mode options:
#   one_way     — search each leg independently, compare per-leg vs price_threshold
#   round_trip  — search outbound+return together, compare total vs round_trip_threshold
#
# For round_trip mode:
#   - Pair BAQ→MDE with MDE→BAQ (matched by origin/destination)
#   - round_trip_threshold: max combined price (defaults to 2 × price_threshold)
#   - return_days: valid days for the return leg

# =============================================================================
# Airline Policy
# =============================================================================
airline_policy:
  priority_airlines:
    - LATAM             # Priority: include if ≤ priority_threshold.
  priority_threshold: 180000  # LATAM threshold (higher due to points benefit).
  bargain_threshold: 110000   # Any airline always included if price ≤ this.
  extra_airlines:
    - name: Wingo
      max_price: 150000
    - name: JetSMART
      max_price: 150000
    - name: Avianca
      max_price: 150000

routes:
  # === ROUND-TRIP: BAQ ↔ MDE ===
  # Outbound Thu/Fri, return Sun/Mon.
  # Total price compared against round_trip_threshold (300k = ~150k per leg).
  - origin: BAQ
    destination: MDE
    price_threshold: 150000
    round_trip_threshold: 300000
    drop_percentage: 15
    search_mode: round_trip
    search_days: [thursday, friday]
    return_days: [sunday, monday]

  - origin: MDE
    destination: BAQ
    price_threshold: 150000
    round_trip_threshold: 300000
    drop_percentage: 15
    search_mode: round_trip
    search_days: [sunday, monday]
    return_days: [thursday, friday]

  # === ONE-WAY FALLBACK (disabled) ===
  # Uncomment to compare or debug individual legs.
  # - origin: BAQ
  #   destination: MDE
  #   price_threshold: 150000
  #   drop_percentage: 15
  #   search_mode: one_way
  #   search_days: [thursday, friday]
  #
  # - origin: MDE
  #   destination: BAQ
  #   price_threshold: 150000
  #   drop_percentage: 15
  #   search_mode: one_way
  #   search_days: [sunday, monday]

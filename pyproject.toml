[project]
name = "aventure-tracker"
version = "0.1.0"
description = "Zero-cost orchestrator for tracking cheap flights and adventure activities"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nilson Nieto" }]

dependencies = [
    "playwright>=1.40.0,<2.0.0",
    "playwright-stealth>=1.0.0,<3.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "pytesseract>=0.3.10,<1.0.0",
    "Pillow>=11.0.0,<13.0.0",
    "holidays>=0.102,<1.0.0",
    "google-genai>=2.17.0,<3.0.0",
    "resend>=2.0.0,<3.0.0",
    "setuptools>=84.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "ruff>=0.3.0,<1.0.0",
    "pre-commit>=3.6.0,<5.0.0",
]

[project.scripts]
aventure-tracker = "aventure_tracker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aventure_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests (deselect with '-m not integration')",
    "slow: slow tests",
]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::ResourceWarning",
    "ignore::RuntimeWarning:asyncio",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "N", "F841", "W291", "W293"]
"src/aventure_tracker/infrastructure/email_notifier.py" = ["F821"]
"src/aventure_tracker/scrapers/**/*.py" = ["S311", "S108"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["aventure_tracker"]

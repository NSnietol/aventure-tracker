name: Flight Tracker

on:
  schedule:
    # Run twice daily: 7 AM and 7 PM Colombia time
    - cron: "0 12 * * *"  # 7 AM Colombia (UTC-5)
    - cron: "0 0 * * *"   # 7 PM Colombia (UTC-5)
  workflow_dispatch:
    inputs:
      weeks:
        description: "Weeks ahead to check"
        required: false
        default: "8"
        type: string

env:
  CI: true
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GITHUB_GIST_ID: ${{ secrets.GIST_ID }}
  GITHUB_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

jobs:
  track-flights:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run Flight Tracker
        run: |
          python -m aventure_tracker.main \
            --mode flights \
            --weeks ${{ github.event.inputs.weeks || '8' }} \
            --verbose

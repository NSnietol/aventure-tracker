name: Adventure Tracker

on:
  schedule:
    # Run daily at 8:00 AM Colombia time (UTC-5 = 13:00 UTC)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - flights
          - activities
      weeks:
        description: "Weeks ahead to check for flights"
        required: false
        default: "8"
        type: string

env:
  CI: true
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GITHUB_GIST_ID: ${{ secrets.GIST_ID }}
  GITHUB_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run Adventure Tracker
        run: |
          python -m aventure_tracker.main \
            --mode ${{ github.event.inputs.mode || 'all' }} \
            --weeks ${{ github.event.inputs.weeks || '8' }} \
            --verbose

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-logs
          path: |
            *.log
            playwright-reports/
          retention-days: 7

  notify-failure:
    runs-on: ubuntu-latest
    needs: track
    if: failure()

    steps:
      - name: Send failure notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="<b>Adventure Tracker Failed</b>%0A%0AWorkflow run failed. Check GitHub Actions for details.%0A%0A<a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Run</a>"

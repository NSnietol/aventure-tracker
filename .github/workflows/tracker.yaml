name: Adventure Tracker

on:
  schedule:
    # Mon, Wed, Fri at 8:00 AM Colombia time (UTC-5 = 13:00 UTC)
    - cron: "0 13 * * 1,3,5"
  workflow_dispatch:
    inputs:
      weeks:
        description: "Weeks ahead to check for flights"
        required: false
        default: "10"
        type: string

env:
  CI: true
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}
  GITHUB_GIST_ID: ${{ secrets.GIST_ID }}
  GITHUB_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  run:
    name: Daily Flight + Event Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pyproject.toml') }}
          restore-keys: playwright-chromium-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright (chromium only)
        run: playwright install chromium --with-deps

      - name: Run tracker (flights mode)
        run: |
          python -m aventure_tracker.main \
            --mode flights \
            --weeks ${{ github.event.inputs.weeks || '10' }} \
            --verbose

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 3

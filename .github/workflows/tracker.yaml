name: Adventure Tracker

on:
  schedule:
    # Run daily at 8:00 AM Colombia time (UTC-5 = 13:00 UTC)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - flights
          - activities
      weeks:
        description: "Weeks ahead to check for flights"
        required: false
        default: "8"
        type: string

env:
  CI: true
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}
  GITHUB_GIST_ID: ${{ secrets.GIST_ID }}
  GITHUB_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run Adventure Tracker
        run: |
          python -m aventure_tracker.main \
            --mode ${{ github.event.inputs.mode || 'all' }} \
            --weeks ${{ github.event.inputs.weeks || '8' }} \
            --verbose

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-logs
          path: |
            *.log
            playwright-reports/
          retention-days: 7

  notify-failure:
    runs-on: ubuntu-latest
    needs: track
    if: failure()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Send failure email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os
          from aventure_tracker.infrastructure.email_notifier import EmailNotifier

          api_key = os.environ.get("RESEND_API_KEY", "")
          email_to = os.environ.get("EMAIL_TO", "")

          if not api_key or not email_to:
              print("Email not configured, skipping failure notification")
              exit(0)

          notifier = EmailNotifier(api_key=api_key, to_email=email_to)

          server = os.environ.get("GITHUB_SERVER_URL", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = f"{server}/{repo}/actions/runs/{run_id}" if server and repo and run_id else ""

          notifier.send_error_report(
              errors=["CI job failed — el proceso del tracker no completó. Revisa los logs para más detalles."],
              mode="all",
              duration_seconds=0.0,
              routes_checked=0,
              routes_total=2,
              alerts_generated=0,
              run_url=run_url,
          )
          print("Failure email sent")
          EOF

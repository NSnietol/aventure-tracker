name: Adventure Tracker

on:
  schedule:
    # Daily at 8:00 AM Colombia time (UTC-5 = 13:00 UTC)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      weeks:
        description: "Weeks ahead to check for flights"
        required: false
        default: "10"
        type: string

env:
  CI: true
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}
  GITHUB_GIST_ID: ${{ secrets.GIST_ID }}
  GITHUB_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  run:
    name: Daily Flight + Event Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pyproject.toml') }}
          restore-keys: playwright-chromium-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright (chromium only)
        run: playwright install chromium --with-deps

      - name: Run tracker (flights mode)
        run: |
          python -m aventure_tracker.main \
            --mode flights \
            --weeks ${{ github.event.inputs.weeks || '10' }} \
            --verbose

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 3

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: run
    if: failure()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Send failure email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os
          from aventure_tracker.infrastructure.email_notifier import EmailNotifier

          api_key = os.environ.get("RESEND_API_KEY", "")
          email_to = os.environ.get("EMAIL_TO", "")

          if not api_key or not email_to:
              print("Email not configured, skipping")
              exit(0)

          server = os.environ.get("GITHUB_SERVER_URL", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = f"{server}/{repo}/actions/runs/{run_id}" if all([server, repo, run_id]) else ""

          notifier = EmailNotifier(api_key=api_key, to_email=email_to)
          notifier.send_error_report(
              errors=["CI job failed — tracker no completó. Revisa los logs."],
              mode="flights",
              duration_seconds=0.0,
              routes_checked=0,
              routes_total=2,
              alerts_generated=0,
              run_url=run_url,
          )
          print("Failure email sent")
          EOF
